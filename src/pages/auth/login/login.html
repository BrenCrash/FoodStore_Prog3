<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Food Store - login</title>
    <link rel="stylesheet" href="../../../../css/login.css">

</head>

<body>
    <div class="container">
        <form id="login-form" 
         class="login-form">
            
            <h1>FOOD STORE</h1>

            <h2>Iniciar Sesion</h2>

            <label for="email">Email:</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="ingresatucorreo@gmail.com"
                required>

            <label for="password">Contraseña:</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Minimo 8 caracteres"
                required>
            
                
            <button type="submit">INGRESAR</button>

            <p class="registro">
                ¿Todavía no tenes cuenta? <a href="../registro/registro.html">Registrate acá</a>

            </p>
        </form>    



    </div>

<script type="module" src="./login.ts"></script>
</body>
</html>
